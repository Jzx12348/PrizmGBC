name: Publish PrizmGBC development pre-release
# Rebuild the existing v1.3.0-development tag when release metadata changes.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"
    tags:
      - "v*-development"

permissions:
  contents: write

jobs:
  publish-development:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Prepare v1.3.0 development pre-release') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-development'))
    name: Build and publish development pre-release
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'master' }}
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Publish development pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0-development' }}
          target_commitish: master
          name: PrizmGBC ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.3.0-development' }}
          draft: false
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          fail_on_unmatched_files: true
          body: |
            ## **Development build · PRE-RELEASE**

            *PrizmGBC v1.3.0 is an in-development build for the Casio fx-CG50. This release introduces library and usability improvements that need testing on a physical calculator.*

            ## New features and improvements

            - **Individual game information:** View cartridge and ROM metadata on dedicated game pages.
            - **Remembered library layout:** Switch between grid and list views, with your preference saved between launches.
            - **Playtime tracking:** Track playtime per game and sort the library by accumulated playtime.
            - **Per-game settings profiles:** Save and manually apply individual performance, display, audio and control settings.
            - **Save-state controls:** Press **F3 to save** and **F4 to load** the selected save-state slot, both during gameplay and in the dedicated three-slot save-state manager.

            ---

            **Development build.** This is a pre-release and is not recommended as a replacement for the stable v1.2.0 release. Features may contain bugs or behave unexpectedly. Please test on a physical Casio fx-CG50 and report issues through GitHub Issues.
