name: Publish PrizmGBC stable # Stable releases only; the beta tag is never modified.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Prepare v1.3.1 patch release'
    name: Build and publish stable release
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          ref: master
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate calculator add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Move v1.3.1 tag to the patched source
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: |
          git tag -f v1.3.1 $env:GITHUB_SHA
          git push origin refs/tags/v1.3.1 --force

      - name: Update existing stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          target_commitish: master
          name: v1.3.1
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          fail_on_unmatched_files: true
          body: |
            A Game Boy and Game Boy Color emulator for the Casio fx-CG50.

            *Stable patch v1.3.1, updating the existing release.*

            ## Improvements and fixes

            - **Game library:** Refined grid/list navigation, favourites, recently played, game information and per-game settings profiles.
            - **Save states:** Three slots, with **F3 to save** and **F4 to load**.
            - **Library shortcuts:** F1 MENU and F5 NOTES hints. F5 opens the selected game's matching .txt notes file from the menu; its Game Boy Select mapping during gameplay is unchanged.
            - **fx-CG50 stability:** Avoids Ptune2 calls on CG50 devices and hardens shutdown cleanup to reduce the risk of calculator instability.

            The Ptune2 restriction is based on the SDK header warning. The intermittent disappearing-add-ins symptom still requires verification on a physical fx-CG50; this build should not be treated as hardware-confirmed.
