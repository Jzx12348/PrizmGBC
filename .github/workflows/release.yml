name: Publish PrizmGBC stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0-alpha"
        required: true
        default: "v0.1.0-alpha"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft-release:
    name: Publish stable release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: master
          draft: false
          prerelease: false
          generate_release_notes: false
          name: PrizmGBC v1.2.0
          body: |
            ## PrizmGBC v1.2.0

            A Game Boy and Game Boy Color emulator for the Casio fx-CG50.

            ## New in v1.2.0

            - **Recently played:** Quickly access the five most recently launched games.
            - **Library sorting:** Sort games by name, recent activity, or favourites.
            - **Categorized settings:** Settings are organized into Performance, Display, Controls, Audio, and System sections.
            - **Three save-state slots:** Select between three separate save-state files.
            - **Settings migration:** Existing v1.1.0 settings are migrated when upgrading.

            ---

            **Stable release.** Please report bugs or compatibility issues through GitHub Issues. Hardware testing on a physical fx-CG50 is recommended.

            Experimental Game Boy and Game Boy Color emulator for the Casio Prizm.

            **Release asset required:** attach the tested `PrizmGBC.g3a` add-in before publishing this draft.

            ### Before publishing
            - [ ] Built from the tagged source using PrizmSDK.
            - [ ] Tested on a physical Casio fx-CG50.
            - [ ] Recorded calculator OS version and build configuration.
            - [ ] Tested at least one known-good `.gb` and one `.gbc` ROM.
            - [ ] Added `PrizmGBC.g3a` to this release.
