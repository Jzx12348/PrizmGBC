name: Publish PrizmGBC stable # v1.3.2 patch release; the archived beta tag is never modified.

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Prepare v1.3.2 patch release'
    name: Build and publish stable release
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          ref: master
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate calculator add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Create v1.3.2 tag
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: |
          git tag v1.3.2 $env:GITHUB_SHA
          git push origin refs/tags/v1.3.2

      - name: Publish v1.3.2 stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.2
          target_commitish: master
          name: v1.3.2
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          fail_on_unmatched_files: true
          body: |
            ## A Game Boy and Game Boy Color emulator for the Casio fx-CG50.

            *Stable patch release v1.3.2.*

            ## Fixes

            - **F5 NOTES:** Hardened notes-file loading and rendering with validated offsets, a null-terminated read buffer and bounds-checked line rendering.
            - Prevents the F5 notes screen from reading beyond the loaded text buffer.

            ## Important testing note

            The automated Windows SDK build passed. The reported issue where installed .g3a add-ins disappear from the calculator launcher after exiting PrizmGBC still requires testing on a physical fx-CG50. This release does not claim that symptom is resolved.
