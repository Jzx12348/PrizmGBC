name: Publish PrizmGBC stable

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  publish-stable:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.event.head_commit.message == 'Prepare v1.3.0 stable release'
    name: Build and publish stable release
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          ref: master
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate calculator add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          target_commitish: master
          name: v1.3.0
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          fail_on_unmatched_files: true
          body: |
            ## **Stable release**

            *PrizmGBC v1.3.0 is the stable library and usability release for the Casio fx-CG50.*

            ## New features and improvements

            - **Refined game library:** Improved grid/list navigation, persistent layout preference, favourites and clearer selected-game information.
            - **Recently played experience:** Recent-game indicators, recent-activity sorting and per-game playtime display.
            - **Game information:** Dedicated pages showing ROM title, file size, cartridge type, ROM capacity and RAM capacity.
            - **Per-game settings profiles:** Save and manually apply performance, display, audio and control settings. Profile data is validated, and a full profile store no longer silently overwrites an existing profile.
            - **Save-state manager:** Three slots for the currently loaded game, with **F3 to save** and **F4 to load** both in the manager and during gameplay.
            - **Settings migration:** Legacy default save/load bindings migrate to F3/F4 without overwriting custom key mappings.

            ## Stable release notes

            This stable release follows the v1.3.0 testing cycle and includes the completed library and usability work, improved settings tab spacing, and a main-library footer that places each action label directly above its matching calculator key. The earlier v1.3.0-beta release remains unchanged in the release archive.
