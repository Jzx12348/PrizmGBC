name: Build PrizmGBC

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows SDK build
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          path: PrizmSDK/projects/PrizmGBC

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Upload calculator add-in
        uses: actions/upload-artifact@v4
        with:
          name: PrizmGBC-g3a
          path: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling development build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: master
          name: dev
          body: |
            **Development build · PRE-RELEASE**

            This is the latest development build from the master branch. It may contain unfinished features, experimental changes, or regressions. It is intended for testing, not everyday use.

            For a stable version, install the latest numbered release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) }}
          generate_release_notes: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}
