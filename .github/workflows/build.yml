name: Build PrizmGBC

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows SDK build
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Upload calculator add-in
        uses: actions/upload-artifact@v4
        with:
          name: PrizmGBC-g3a
          path: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling development build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: master
          name: v1.2.0-development
          body: |
            ## **Development build · PRE-RELEASE**

            *This is the latest development build from ongoing v1.2.0 development on master. It may contain unfinished features, experimental changes, or regressions. It is intended for testing, not everyday use.*

            ## **v1.2.0 development focus**
            - Complete interface redesign with stronger contrast and improved readability.
            - Continued refinement of the categorized settings and game library.
            - Per-game configuration profiles.
            - Additional library and gameplay quality-of-life improvements.

            This build already includes recently played games, library sorting, and categorized settings. The remaining v1.2.0 focus items are planned work, not completed features. Please report bugs, compatibility issues, and performance differences. A successful build does not guarantee physical fx-CG50 validation.

            For a stable version, install the latest numbered release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) }}
          generate_release_notes: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}
