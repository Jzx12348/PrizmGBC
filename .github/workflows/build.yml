name: Build PrizmGBC

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows SDK build
    runs-on: windows-latest
    steps:
      - name: Check out PrizmSDK
        uses: actions/checkout@v4
        with:
          repository: Jzx12348/PrizmSDK
          ref: master
          path: PrizmSDK

      - name: Check out PrizmGBC
        uses: actions/checkout@v4
        with:
          path: PrizmSDK/projects/PrizmGBC

      - name: Generate add-in icons
        shell: pwsh
        working-directory: PrizmSDK/projects/PrizmGBC
        run: ./generate-icons.ps1

      - name: Build PrizmGBC
        shell: cmd
        working-directory: PrizmSDK\\projects\\PrizmGBC
        run: |
          call make.bat DEFINES="-DTARGET_PRIZM=1 -DDEBUG=0" CONFIG=DeviceRelease
          if not exist PrizmGBC.g3a exit /b 1

      - name: Upload calculator add-in
        uses: actions/upload-artifact@v4
        with:
          name: PrizmGBC-g3a
          path: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling development build
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          target_commitish: master
          name: v1.2.0-development
          body: |
            ## **Development build · PRE-RELEASE**

            *The latest development build from ongoing v1.2.0 development on master. This build is intended for testing and may contain unfinished changes or regressions.*

            ## **New in v1.2.0 development**

            - Recently played list showing the five most recently launched games.
            - Library sorting by name, recent activity, or favourites.
            - Categorized settings interface with Performance, Display, Controls, Audio, and System sections.
            - Three selectable save-state slots, allowing separate save-state files for each slot.
            - Settings migration intended to preserve existing v1.1.0 settings when upgrading.

            ## **Testing notes**

            Please test library sorting, recently played history, settings navigation and persistence, and all three save-state slots on a physical fx-CG50. A successful build does not guarantee hardware validation.

            Report bugs, compatibility issues, and performance differences through GitHub Issues.

            For everyday use, install the latest stable numbered release.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          make_latest: ${{ !(contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc')) }}
          generate_release_notes: true
          files: PrizmSDK/projects/PrizmGBC/PrizmGBC.g3a
          token: ${{ secrets.GH_TOKEN }}
