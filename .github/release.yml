changelog:
  categories:
    - title: "✨ Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "🧰 Maintenance"
      labels:
        - "maintenance"
        - "dependencies"
    - title: "📚 Documentation"
      labels:
        - "documentation"
    - title: "Other changes"
      labels:
        - "*"
  exclude:
    labels:
      - "skip-changelog"
      - "duplicate"
      - "invalid"
